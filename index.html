<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phone Picker</title>
<style>
:root{--bg:#F7F4EE;--tile:#F1E8D8;--tile2:#EADFCB;--ink:#22201C;--muted:#8A8172;--line:#E2D7C4;--accent:#35302A;--green:#2FAE5E}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#ECE7DE;overflow:hidden}
body{display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
#wrap{position:relative}
.stage{position:absolute;left:0;top:0;width:1080px;height:1920px;transform-origin:0 0;background:var(--bg);overflow:hidden;color:var(--ink)}
.tile{position:absolute;width:470px;height:560px;border-radius:44px;background:linear-gradient(160deg,#F6EFE2,var(--tile) 60%,var(--tile2));box-shadow:0 2px 0 rgba(255,255,255,.7) inset,0 18px 40px -22px rgba(90,70,40,.35);will-change:transform}
.tile .ring{position:absolute;inset:-6px;border-radius:50px;border:6px solid var(--accent);opacity:0}
.tile img{position:absolute;left:50%;top:44%;width:400px;height:400px;object-fit:contain;transform:translate(-50%,-50%);filter:drop-shadow(0 18px 22px rgba(60,45,25,.22))}
.tile .lbl{position:absolute;left:0;right:0;bottom:34px;text-align:center;font-size:40px;font-weight:650;letter-spacing:.2px}
.panel{position:absolute;left:50px;top:1350px;width:980px;padding:44px 48px 48px;border-radius:44px;background:#fff;box-shadow:0 24px 60px -30px rgba(80,60,30,.35);opacity:0;will-change:transform,opacity}
.cap{font-size:32px;font-weight:600;color:var(--muted);margin:0 0 16px 6px}
.field{position:relative;height:112px;border-radius:28px;background:#FBF8F2;border:3px solid var(--line);font-size:44px;font-weight:550;display:flex;align-items:center;padding:0 34px;transition:none}
.field.on{border-color:var(--accent)}
.caret{display:inline-block;width:3px;height:48px;background:var(--ink);margin-left:3px;opacity:0}
.btn{position:relative;overflow:hidden;height:112px;border-radius:28px;background:var(--accent);color:#F7F1E6;font-size:42px;font-weight:650;display:flex;align-items:center;justify-content:center;letter-spacing:.3px;margin-top:26px}
.ripple{position:absolute;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.35);transform:translate(-50%,-50%) scale(0);pointer-events:none}
.dim{position:absolute;inset:0;background:rgba(40,32,20,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0}
.modal{position:absolute;left:90px;top:630px;width:900px;height:650px;padding:56px 56px;border-radius:52px;background:#fff;box-shadow:0 40px 90px -30px rgba(50,35,15,.45);opacity:0;will-change:transform,opacity}
.modal .cap{margin-top:8px}
.form{position:absolute;left:56px;right:56px;top:50px}
.check{position:absolute;left:50%;top:50%;width:400px;height:400px;margin:-200px 0 0 -200px;opacity:0}
.hand{position:absolute;left:0;top:0;width:380px;will-change:transform;filter:drop-shadow(0 22px 26px rgba(40,30,15,.28))}
.hand img{width:100%;display:block}
.tap{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;border:4px solid rgba(43,42,39,.45);opacity:0;pointer-events:none}
</style></head><body>

</div></div>
<script>
const D=8.0, TIP=[61,5];
const $=id=>document.getElementById(id);
const stage=$('stage'),wrap=$('wrap');
function fit(){const s=Math.min(innerWidth/1080,innerHeight/1920);stage.style.transform=`scale(${s})`;wrap.style.width=1080*s+'px';wrap.style.height=1920*s+'px'}
addEventListener('resize',fit);fit();

const cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const io=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;          // easeInOutCubic
const out=p=>1-Math.pow(1-p,3);                             // easeOutCubic
const back=p=>{const c=1.5;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
const seg=(t,a,b)=>cl((t-a)/(b-a));

// Cursor keyframes [time, x, y] in stage coords (fingertip position)
const OFF=[1000,2280], APPLE=[285,985], NUM=[560,1505], ADD=[540,1662], NAME=[470,800], MAIL=[520,1000], GO=[540,1190];
const K=[[0,...OFF],[0.25,...OFF],[1.05,...APPLE],[1.35,...APPLE],[1.95,...NUM],[2.30,...NUM],[2.75,...ADD],[3.00,...ADD],[3.50,...NAME],[4.05,...NAME],[4.45,...MAIL],[5.50,...MAIL],[5.90,...GO],[6.15,...GO],[6.95,...OFF],[8,...OFF]];
const TAPS=[1.12,2.02,2.82,3.57,4.52,5.97];
function cursor(t){
  for(let i=0;i<K.length-1;i++){const a=K[i],b=K[i+1];if(t>=a[0]&&t<=b[0]){
    const p=io(seg(t,a[0],b[0]));const dx=b[1]-a[1],dy=b[2]-a[2],L=Math.hypot(dx,dy)||1;
    const arc=Math.sin(Math.PI*p)*Math.min(70,L*.12);       // gentle curved path
    return [a[1]+dx*p+(-dy/L)*arc, a[2]+dy*p+(dx/L)*arc];}}
  return OFF;
}
function press(t){let v=0,rip=null;for(const s of TAPS){const p=seg(t,s-.06,s+.18);if(p>0&&p<1){v=Math.sin(Math.PI*p);}
  const r=seg(t,s,s+.45);if(r>0&&r<1)rip=r;}return [v,rip];}
function typed(str,t,a,b){const n=Math.round(cl((t-a)/(b-a))*str.length);return str.slice(0,n)}
function caret(el,t,a,b){el.style.opacity=(t>=a&&t<b)?(Math.floor((t-a)*3.2)%2?0:1):0}

const tiles=[0,1,2,3].map(i=>$('t'+i));
function render(t){
  const R=io(seg(t,7.4,7.95));          // reset fade (end of loop)
  // tiles: idle float + selection
  const sel=out(seg(t,1.12,1.45))*(1-R);
  tiles.forEach((el,i)=>{
    const fl=Math.sin((t/D)*Math.PI*2+i*1.3)*4;
    const isA=i===2;
    const pr=isA?press(t)[0]*(t<1.5?1:0):0;
    const sc=isA?1+.03*sel-.025*pr:1-.02*sel*.0;
    el.style.transform=`translateY(${fl}px) scale(${sc})`;
    el.querySelector('.ring').style.opacity=isA?sel:0;
    el.style.opacity=isA?1:1-.35*sel;
  });
  // panel
  const pin=out(seg(t,1.35,1.75))*(1-R);
  const panel=$('panel');panel.style.opacity=pin;panel.style.transform=`translateY(${(1-pin)*60}px)`;
  $('vNum').textContent=R>0.5?'':typed('32',t,2.1,2.32);
  $('fNum').classList.toggle('on',t>2.02&&t<2.8);caret($('cNum'),t,2.02,2.8);
  // modal
  const min=out(seg(t,3.0,3.38))*(1-R);
  $('dim').style.opacity=min;
  const m=$('modal');m.style.opacity=min;m.style.transform=`translateY(${(1-min)*50}px) scale(${.96+.04*min})`;
  $('vName').textContent=R>0.5?'':typed('Alex',t,3.65,4.0);
  $('vMail').textContent=R>0.5?'':typed('alex@mymail.com',t,4.6,5.42);
  $('fName').classList.toggle('on',t>3.57&&t<4.5);caret($('cName'),t,3.57,4.5);
  $('fMail').classList.toggle('on',t>4.52&&t<5.95);caret($('cMail'),t,4.52,5.95);
  // success
  const fo=io(seg(t,6.08,6.35));
  $('form').style.opacity=1-fo;$('form').style.transform=`scale(${1-.05*fo})`;
  const ck=seg(t,6.18,6.62);const ch=$('check');
  ch.style.opacity=cl(ck*3);ch.style.transform=`scale(${ck>0?.4+.6*back(ck):.4})`;
  $('cp').style.strokeDashoffset=140*(1-io(seg(t,6.4,6.85)));
  // buttons press + ripple
  [['bAdd',2.82,ADD],['bGo',5.97,GO]].forEach(([id,s])=>{const b=$(id),p=seg(t,s-.05,s+.2),r=seg(t,s,s+.5);
    b.style.transform=`scale(${1-.035*Math.sin(Math.PI*p)})`;const rp=b.querySelector('.ripple');
    rp.style.left='50%';rp.style.top='50%';rp.style.opacity=r>0&&r<1?(1-r):0;rp.style.transform=`translate(-50%,-50%) scale(${r*24})`;});
  // hand
  const [x,y]=cursor(t);const [pv,rip]=press(t);
  $('hand').style.transform=`translate(${x-TIP[0]*380/330}px,${y-TIP[1]*380/330}px)`;
  $('hand').style.transformOrigin=`${TIP[0]*380/330}px ${TIP[1]*380/330}px`;
  $('hand').style.transform+=` rotate(${-10+3*pv}deg) scale(${1-.07*pv})`;
  const tp=$('tap');tp.style.left=x+'px';tp.style.top=y+'px';
  tp.style.opacity=rip?(1-rip)*.9:0;tp.style.transform=`scale(${rip?.3+rip*1.1:.3})`;
}
const params=new URLSearchParams(location.search);
let fixed=params.has('t')?parseFloat(params.get('t')):null;
const t0=performance.now();
function loop(now){render(fixed!==null?fixed:((now-t0)/1000)%D);requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script></body></html>
